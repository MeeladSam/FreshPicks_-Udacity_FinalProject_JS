<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Fruit Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-top">
            <div class="logo">Fresh<span>Picks</span></div>
            <div class="header-right">
                
                <button class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</button>
            </div>
        </div>
        <div class="header-banner">Hope you have a Wonderful Day! 🌿</div>
    </div>

    <!-- PAGE LAYOUT -->
    <div class="page-layout">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <hr class="sidebar-divider">
            <h3>Sort By</h3>
            <button class="filter-btn">Price: Low to High</button>
            <button class="filter-btn">Price: High to Low</button>
            <button class="filter-btn">Default</button>
          
        </div>

        <!-- MAIN -->
        <div class="main-content">

            <!-- Hero Banner -->
            <div class="hero-banner">
                <div class="hero-text">
                    <h2>Farm Fresh,<br>Delivered Daily </h2>
                    <p>Handpicked from local farms every morning</p>
                    <button>Shop Now </button>
                </div>
            </div>

            <!-- Products -->
            <div class="section-header">
                <h2>Fresh Products</h2>
                <span class="items-count" id="product-count"></span>
            </div>
            <div class="products"></div>

            <!-- Cart -->
            <div class="cart-section">
                <div class="section-header">
                    <h2>Your Cart</h2>
                    <button class="empty-cart-btn">Clear cart</button>
                </div>
                <div class="cart"></div>
            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="right-col">

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-num" id="stat-items">0</div>
                    <div class="stat-label">Items</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num cart-total-amount">$0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>

            <!-- Checkout Panel -->
            <div class="checkout-panel">
                <div class="checkout-panel-header">
                    <h2>Checkout</h2>
                </div>
                <div class="checkout-body">
                    <div class="total-row">
                        <span>Order Total</span>
                        <span class="cart-total-amount">$0.00</span>
                    </div>
                    <label>Cash Received ($)</label>
                    <input class="received" type="number" min="0" step="0.01" placeholder="Enter amount...">
                    <button class="pay-btn pay">Submit Payment ✓</button>
                    <p class="receipt-title">Receipt</p>
                    <div class="pay-summary"></div>
                </div>
            </div>

            <!-- Trust -->
            <div class="trust-row">
                <h3>Why shop with us</h3>
                <div class="trust-item">Free delivery over $30</div>
                <div class="trust-item">100% fresh guarantee</div>
                <div class="trust-item">Easy returns</div>
                <div class="trust-item">Locally sourced</div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="front.js"></script>

</body>
</html>
